services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mock_fund_league_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: ./bin/rails server -b 0.0.0.0 -p 3000
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mock_fund_league_development
      MARKET_DATA_PYTHON_BIN: /opt/market-data-venv/bin/python
      SOLID_QUEUE_IN_PUMA: "0"
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - .:/rails

  jobs:
    build: .
    command: ./bin/jobs
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mock_fund_league_development
      MARKET_DATA_PYTHON_BIN: /opt/market-data-venv/bin/python
    depends_on:
      - db
    volumes:
      - .:/rails

volumes:
  postgres_data:
