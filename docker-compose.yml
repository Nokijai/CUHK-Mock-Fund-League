services:
  db:
    image: postgres:16
    environment:
      # Prefer .env values, keep defaults for first-run local setup.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mock_fund_league_development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mock_fund_league_development}"]
      interval: 5s
      timeout: 5s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      args:
        # Keep development gems (web-console/debug) but skip heavy test toolchain.
        BUNDLE_WITHOUT: "test"
    command: bash -lc "rm -f /rails/tmp/pids/server.pid && ./bin/rails server -b 0.0.0.0 -p 3000"
    # Load runtime env directly from .env so local changes apply in containers.
    env_file:
      - .env
    environment:
      # Explicit fallbacks keep compose bootable even if a key is absent in .env.
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/mock_fund_league_development}
      QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL:-postgresql://postgres:postgres@db:5432/mock_fund_league_development}
      CACHE_DATABASE_URL: ${CACHE_DATABASE_URL:-postgresql://postgres:postgres@db:5432/mock_fund_league_development}
      CABLE_DATABASE_URL: ${CABLE_DATABASE_URL:-postgresql://postgres:postgres@db:5432/mock_fund_league_development}
      MARKET_DATA_PYTHON_BIN: ${MARKET_DATA_PYTHON_BIN:-/opt/market-data-venv/bin/python}
      SOLID_QUEUE_IN_PUMA: ${SOLID_QUEUE_IN_PUMA:-0}
    ports:
      - "${WEB_PORT:-3000}:3000"
    # Health only after boot + migrations, so downstream services can wait safely.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/rails

  jobs:
    build:
      context: .
      args:
        # Worker only needs runtime + development gems in local docker.
        BUNDLE_WITHOUT: "test"
    command: ./bin/jobs
    # Mirror web env loading so worker and app stay in sync.
    env_file:
      - .env
    environment:
      # Worker inherits same DB/env conventions as web.
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/mock_fund_league_development}
      QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL:-postgresql://postgres:postgres@db:5432/mock_fund_league_development}
      CACHE_DATABASE_URL: ${CACHE_DATABASE_URL:-postgresql://postgres:postgres@db:5432/mock_fund_league_development}
      CABLE_DATABASE_URL: ${CABLE_DATABASE_URL:-postgresql://postgres:postgres@db:5432/mock_fund_league_development}
      MARKET_DATA_PYTHON_BIN: ${MARKET_DATA_PYTHON_BIN:-/opt/market-data-venv/bin/python}
    depends_on:
      db:
        condition: service_healthy
      web:
        # Avoid Solid Queue boot before web has finished db:prepare/db:migrate:queue.
        condition: service_healthy
    volumes:
      - .:/rails

volumes:
  postgres_data:
