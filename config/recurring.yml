# Solid Queue recurring schedule (scheduler runs inside bin/jobs or Puma plugin).
# See: https://github.com/rails/solid_queue#recurring-tasks

development:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Nestak 30 + HK extras: enqueue refresh jobs on this cadence (yfinance in StockPriceUpdateJob).
  nestak_market_data_refresh:
    class: MarketDataRefreshAllJob
    schedule: every 15 minutes

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  nestak_market_data_refresh:
    class: MarketDataRefreshAllJob
    schedule: every 15 minutes
